name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Workspace tests
        run: npm test
      - name: Schema validation
        run: npm run validate:schemas
      - name: Generated schema validator drift
        run: npm run generate:schema-validators && git diff --exit-code -- packages/core/src/generated
      - name: Site build
        run: npm run site:build
      - name: Site checks
        run: npm run site:check
      - name: Whitespace and diff checks
        run: npm run check:diff
